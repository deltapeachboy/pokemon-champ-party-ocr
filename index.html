<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモンSV 画面解析（カプセルエリア・クロップテスト）</title>
    <!-- Tesseract.js の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        h2 { text-align: center; color: #2c3e50; }
        .description { text-align: center; color: #7f8c8d; margin-bottom: 30px; }

        .upload-area {
            border: 3px dashed #bdc3c7;
            padding: 40px 20px;
            text-align: center;
            background: #fff;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #3498db;
            background: #ecf0f1;
        }

        /* 2つの切り出し結果を並べるグリッドレイアウト */
        .results-grid {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .result-card {
            flex: 1;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .result-card h3 {
            margin-top: 0;
            color: #34495e;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }

        canvas {
            border: 2px solid #3498db;
            background: #000;
            max-width: 100%;
            height: auto;
            margin: 15px 0;
            border-radius: 4px;
        }

        .status {
            font-weight: bold;
            color: #e67e22;
            margin: 10px 0;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>ポケモンSV カプセルエリア解析テスト</h2>
    <div class="description">
        画像をアップロードすると、1920x1080にリサイズした上で、チームID（左側）とトレーナー名（右側）をそれぞれ自動で切り出し、並列で文字認識を行います。
    </div>

    <!-- ドロップエリア -->
    <div class="upload-area" id="drop-zone">
        ここにスクリーンショットをドラッグ＆ドロップ<br>（またはクリックして選択）
        <input type="file" id="file-input" accept="image/*" style="display: none;">
    </div>

    <!-- 解析結果のカード表示 -->
    <div class="results-grid">
        <!-- 1. 左側カプセルの解析 -->
        <div class="result-card">
            <h3>1. チーム名 / チームID (左側)</h3>
            <canvas id="canvas-team"></canvas>
            <div class="status" id="status-team">画像の選択を待っています...</div>
            <input type="text" id="output-team" readonly placeholder="結果待機中...">
        </div>

        <!-- 2. 右側カプセルの解析 -->
        <div class="result-card">
            <h3>2. トレーナー名 (右側)</h3>
            <canvas id="canvas-trainer"></canvas>
            <div class="status" id="status-trainer">画像の選択を待っています...</div>
            <output_field></output_field>
            <input type="text" id="output-trainer" style="width: 100%; padding: 8px; box-sizing: border-box; background: #2c3e50; color: #fff; border: none; border-radius: 4px; font-size: 18px; text-align: center; font-weight: bold;" readonly placeholder="結果待機中...">
        </div>
    </div>

    <!-- 仮想リサイズ用の非表示キャンバス -->
    <canvas id="virtual-canvas" style="display: none;"></canvas>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        // 左側の要素
        const canvasTeam = document.getElementById('canvas-team');
        const statusTeam = document.getElementById('status-team');
        const outputTeam = document.getElementById('output-team');

        // 右側の要素
        const canvasTrainer = document.getElementById('canvas-trainer');
        const statusTrainer = document.getElementById('status-trainer');
        const outputTrainer = document.getElementById('output-trainer');

        const virtualCanvas = document.getElementById('virtual-canvas');

        // イベントリスナーの登録
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file) return;
            const img = new Image();
            img.onload = () => processImage(img);
            img.src = URL.createObjectURL(file);
        }

        async function processImage(img) {
            const vCtx = virtualCanvas.getContext('2d');

            // 1. 画像アスペクト比に関わらず、基準座標を1920x1080に正規化
            virtualCanvas.width = 1920;
            virtualCanvas.height = 1080;
            vCtx.drawImage(img, 0, 0, 1920, 1080);

            // 2. カプセル切り出し用の座標パラメータ定義（SV規格 1920x1080ベース）
            const cropY = 95;   // 縦位置
            const cropW = 350;  // 切り出す横幅
            const cropH = 65;   // 切り出す高さ

            const cropX_left = 550;   // 左側（チームID / チーム名）
            const cropX_right = 1050; // 右側（トレーナー名）

            // 3. 左側の切り出しと描画
            canvasTeam.width = cropW;
            canvasTeam.height = cropH;
            const ctxTeam = canvasTeam.getContext('2d');
            ctxTeam.drawImage(virtualCanvas, cropX_left, cropY, cropW, cropH, 0, 0, cropW, cropH);

            // 4. 右側の切り出しと描画
            canvasTrainer.width = cropW;
            canvasTrainer.height = cropH;
            const ctxTrainer = canvasTrainer.getContext('2d');
            ctxTrainer.drawImage(virtualCanvas, cropX_right, cropY, cropW, cropH, 0, 0, cropW, cropH);

            statusTeam.innerText = "認識エンジン初期化中...";
            statusTrainer.innerText = "認識エンジン初期化中...";
            outputTeam.value = "";
            outputTrainer.value = "";

            // 5. 並列（非同期）での文字認識の実行
            // それぞれのキャンバスをTesseractに渡し、同時に処理させます
            Promise.all([
                runOcr(canvasTeam, statusTeam, outputTeam),
                runOcr(canvasTrainer, statusTrainer, outputTrainer)
            ]).then(() => {
                console.log("すべての解析処理が完了しました。");
            });
        }

        // Tesseractの認識を実行するヘルパー関数
        async function runOcr(canvas, statusElement, outputElement) {
            try {
                const result = await Tesseract.recognize(
                    canvas,
                    'jpn',
                    {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                statusElement.innerText = `解析中... (${Math.round(m.progress * 100)}%)`;
                            }
                        }
                    }
                );
                statusElement.innerText = "解析完了";
                // 余計なスペースや改行をクリーンアップして表示
                outputElement.value = result.data.text.replace(/\s+/g, "");
            } catch (error) {
                statusElement.innerText = "エラー発生";
                outputElement.value = "エラー";
                console.error(error);
            }
        }
    </script>
</body>
</html>
