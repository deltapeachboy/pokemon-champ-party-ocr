<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケモン チャンピオンズ パーティ解析＆ブログ生成ツール</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg:#0f1117; --panel:#1a1d27; --border:#2a2d3a;
      --accent:#4f8ef7; --accent2:#34d399; --warn:#f59e0b;
      --text:#e2e8f0; --muted:#64748b; --card:#1e2130; --inp:#252837;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px;}
    header{text-align:center;margin-bottom:28px;}
    header h1{font-size:20px;font-weight:700;letter-spacing:.05em;color:var(--accent);}
    header p{color:var(--muted);font-size:12px;margin-top:5px;}

    .upload-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:860px;margin:0 auto 20px;}
    .dz{border:2px dashed var(--border);border-radius:10px;padding:24px 16px;text-align:center;cursor:pointer;background:var(--panel);transition:border-color .2s,background .2s;position:relative;}
    .dz:hover{border-color:var(--accent);background:#1e2536;}
    .dz.done{border-color:var(--accent2);background:#152820;}
    .dz input[type=file]{display:none;}
    .dz .icon{font-size:28px;margin-bottom:6px;}
    .dz .lbl{font-weight:700;font-size:13px;}
    .dz .sub{font-size:11px;color:var(--muted);margin-top:3px;}
    .dz .st{position:absolute;bottom:8px;left:0;right:0;font-size:11px;color:var(--accent2);}

    #status-bar{max-width:860px;margin:0 auto 18px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;color:var(--warn);text-align:center;}

    .preview-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}
    .prev-box{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:7px 9px;text-align:center;}
    .prev-box span{display:block;font-size:10px;color:var(--muted);margin-bottom:3px;}
    .prev-box canvas{max-height:90px;max-width:200px;border:1px solid var(--border);}

    .party-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(370px,1fr));gap:14px;max-width:1160px;margin:0 auto 28px;}
    .pk-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;}
    .pk-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
    .slot-badge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;}
    .nat-badge{font-size:11px;color:var(--muted);margin-left:auto;}

    .fg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px;}
    .fg.full{grid-template-columns:1fr;}
    .field label{display:block;font-size:10px;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em;}
    .field input{width:100%;background:var(--inp);border:1px solid var(--border);border-radius:4px;color:var(--accent2);font-size:13px;font-weight:600;padding:5px 9px;}
    .field input.raw{color:var(--warn);border-color:#3d3010;}
    .field input.empty{color:var(--muted);}

    .mv-sec{margin-top:9px;}
    .mv-sec .sec-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
    .mv-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}

    .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px;}
    .sc{background:var(--inp);border:1px solid var(--border);border-radius:4px;padding:4px 6px;text-align:center;}
    .sc .sn{font-size:9px;color:var(--muted);display:block;}
    .sc .sv{font-size:13px;font-weight:700;color:var(--text);}
    .sc .se{font-size:9px;color:var(--accent);display:block;}
    .sc.up .sv{color:#f87171;} .sc.dn .sv{color:#60a5fa;}

    .export-area{max-width:860px;margin:0 auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;}
    .export-area h2{font-size:14px;font-weight:700;margin-bottom:14px;}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
    .btn{padding:8px 16px;font-size:12px;font-weight:700;border-radius:5px;border:none;cursor:pointer;transition:opacity .15s;}
    .btn:hover{opacity:.85;}
    .btn-blue{background:var(--accent);color:#fff;}
    .btn-green{background:var(--accent2);color:#000;}
    .btn-gold{background:var(--warn);color:#000;}
    textarea#out{width:100%;height:320px;background:#0a0c14;color:#a3e635;border:1px solid var(--border);border-radius:5px;font-family:'Courier New',monospace;font-size:12px;padding:10px;resize:vertical;}
    canvas#vc{display:none;}
    @media(max-width:600px){.upload-row,.party-grid{grid-template-columns:1fr;}body{padding:10px;}}
  </style>
</head>

<script>
const PC_PANELS = [
  {x:186, y:265, w:747, h:188}, {x:987, y:264, w:748, h:189},
  {x:186, y:482, w:748, h:188}, {x:988, y:482, w:747, h:188},
  {x:187, y:699, w:747, h:189}, {x:987, y:698, w:748, h:190}
];
const SMARTPHONE_PANELS = [
  {x:188, y:237, w:744, h:189}, {x:988, y:238, w:744, h:188},
  {x:187, y:444, w:745, h:199}, {x:986, y:454, w:746, h:189},
  {x:188, y:673, w:745, h:189}, {x:986, y:673, w:746, h:188}
];

let CURRENT_PANELS = PC_PANELS;
const ORIG_PW = 802.0, ORIG_PH = 188.0;

const FRONT_ROWS = [
  ["pokemon", 78,  10, 280, 45],
  ["ability", 95,  62, 260, 38],
  ["item",    95, 112, 310, 42],
  ["move1",  430,   8, 300, 42],

const BACK_BOXES = {

  attack:     {stat:[200, 90, 85, 42], ev:[320, 90, 48, 42]},
  defense:    {stat:[200,132, 85, 42], ev:[320,132, 48, 42]},
  sp_attack:  {stat:[560, 45, 75, 42], ev:[680, 45, 45, 42]},
  sp_defense: {stat:[560, 90, 75, 42], ev:[680, 90, 45, 42]},
  speed:      {stat:[560,132, 75, 42], ev:[680,132, 45, 42]},

const STAT_ARROW_TRIM = 32;
const STAT_NUM_WIDTH = { left: 75, right: 75 };

function getStatCropRect([sx,sy,sw,sh],key){
  if(key==='hp') return [sx,sy,sw,sh];
  const right=key==='sp_attack'||key==='sp_defense'||key==='speed';
  return [sx+STAT_ARROW_TRIM,sy,right?STAT_NUM_WIDTH.right:STAT_NUM_WIDTH.left,sh];
}

function pickDigitValue(raw,oneDigit){
  const nums=raw.match(/\d+/g);
  if(!nums) return '';
  const flat=raw.replace(/\D/g,'');
  const cands=[...nums];
  if(flat.length>3) cands.push(flat.slice(-3));
  const min=oneDigit?0:10, max=oneDigit?252:999;
  const ordered=[...new Set(cands)].sort((a,b)=>b.length-a.length);
  for(const n of ordered){
    const v=parseInt(n,10);
    if(!isNaN(v)&&v>=min&&v<=max) return oneDigit?String(v).slice(0,3):n;
  }
  const fb=ordered[0]||'';
  return oneDigit?fb.slice(0,3):fb;
}

const NATURE_STAT_BOXES = {
  attack:[200, 90, 52, 42], defense:[200,132, 52, 42],
  sp_attack:[560, 45, 45, 42], sp_defense:[560, 90, 45, 42], speed:[560,132, 45, 42],
};

const STAT_KEYS   = ["hp","attack","defense","sp_attack","sp_defense","speed"];
const STAT_LABELS = {hp:"HP",attack:"こうげき",defense:"ぼうぎょ",sp_attack:"とくこう",sp_defense:"とくぼう",speed:"すばやさ"};

const SHOWDOWN_NATURES = {
  "attack:defense":"Lonely","attack:sp_attack":"Adamant","attack:sp_defense":"Naughty","attack:speed":"Brave",
  "defense:attack":"Bold","defense:sp_attack":"Impish","defense:sp_defense":"Lax","defense:speed":"Relaxed",
  "sp_attack:attack":"Modest","sp_attack:defense":"Mild","sp_attack:sp_defense":"Rash","sp_attack:speed":"Quiet",
  "sp_defense:attack":"Calm","sp_defense:defense":"Gentle","sp_defense:sp_attack":"Careful","sp_defense:speed":"Sassy",
  "speed:attack":"Timid","speed:defense":"Hasty","speed:sp_attack":"Jolly","speed:sp_defense":"Naive",
};

let POKEMON_DICT = ["サザンドラ","キラフロル","ムクホーク","クエスパトラ","レックウザ"];
let ABILITY_DICT = ["かそく","ひらいしん","あついしぼう","げきりゅう","おうごんのからだ","ばけのかわ","ふゆう","どくげしょう","じきゅうりょく","いかく"];
let ITEM_DICT    = ["バシャーモナイト","ライチュウナイトY","きあいのタスキ","オボンのみ","こだわりスカーフ","いのちのたま","たべのこし","シビルドナイト","ムクホークナイト"];
let MOVE_DICT    = ["ブレイズキック","とびひざげり","かみなりパンチ","まもる","でんじほう","きあいだま","なみのり","わるだくみ","じしん","つららばり","がんせきふうじ","こおりのつぶて","クイックターン","あくび","ステルスロック","ゴールドラッシュ","シャドーボール","10まんボルト","トリック","じゃれつく","シャドークロー","かげうち","つるぎのまい","あくのはどう","りゅうせいぐん","とんぼがえり","かえんほうしゃ","だいちのちから","エナジーボール","パワージェム","ドラゴンテール","はどうだん","ブレイブバード","バトンタッチ","こうそくいどう","サンダーダイブ","ドレインパンチ","とぐろをまく","ドラゴンクロー"];

let POKEMON_JA_TO_EN = {}, ABILITY_JA_TO_EN = {}, ITEM_JA_TO_EN = {}, MOVE_JA_TO_EN = {};

// #region agent log
function dbgLog(location, message, data, hypothesisId) {
  fetch('http://127.0.0.1:7834/ingest/f395d805-f119-437f-8e96-54806f1e1670', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Debug-Session-Id': 'eeb357' },
    body: JSON.stringify({ sessionId: 'eeb357', runId: 'pre-fix', hypothesisId, location, message, data, timestamp: Date.now() })
  }).catch(() => {});
}
// #endregion

async function loadDictionaries() {
  setStatus("辞書データを読み込んでいます...");
  const tryFetch = async (path, parser) => new Promise(resolve => {
    const timer = setTimeout(() => resolve(null), 1500);
    fetch(path).then(r => r.ok ? r.text() : Promise.reject()).then(t => {
      clearTimeout(timer); resolve(parser(t));
    }).catch(() => { clearTimeout(timer); resolve(null); });
  });

  const loadCsv = async (path, dict, map) => {
    const res = await tryFetch(path, t => {
      const list = [];
      t.split('\n').slice(1).forEach(line => {
        const parts = line.split(',');
        if (!parts[1]) return;
        const ja = parts[1].trim().replace(/"/g, '');
        const en = parts[2] ? parts[2].trim().replace(/"/g, '') : ja;
        list.push(ja); map[ja] = en;
      });
      return list;
    });
    if (res?.length) dict.splice(0, dict.length, ...res);
  };

  await loadCsv('./data/masters/pokemon.csv', POKEMON_DICT, POKEMON_JA_TO_EN);
  await loadCsv('./data/masters/item.csv', ITEM_DICT, ITEM_JA_TO_EN);
  await loadCsv('./data/masters/move.csv', MOVE_DICT, MOVE_JA_TO_EN);
  await loadCsv('./data/masters/ability.csv', ABILITY_DICT, ABILITY_JA_TO_EN);

  setStatus("準備完了。表（能力画面）または裏（ステータス画面）をアップロードしてください。");
  // #region agent log
  dbgLog('index.html:loadDictionaries','dict loaded',{pokemon:POKEMON_DICT.length,ability:ABILITY_DICT.length,item:ITEM_DICT.length,move:MOVE_DICT.length,sampleAbility:ABILITY_DICT.includes('かそく')},'H5');
  // #endregion
}

let FRONT_DATA = null, BACK_DATA = null, RAW_DEBUG = [];
const vc = document.getElementById('vc');

function get169Bounds(w,h){
  const r=16/9, cr=w/h;
  let sx=0,sy=0,sw=w,sh=h;
  if(cr>r){sw=h*r;sx=(w-sw)/2;}else if(cr<r){sh=w/r;sy=(h-sh)/2;}
  CURRENT_PANELS = (w/h >= 2.0) ? SMARTPHONE_PANELS : PC_PANELS;
  // #region agent log
  dbgLog('index.html:get169Bounds', 'layout selection', { w, h, aspect: w / h, smartphone: w / h >= 2.0, panelY: CURRENT_PANELS[0].y }, 'H4');
  // #endregion
  return{sx,sy,sw,sh};
}

function cropTo(src,x,y,w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(src,x,y,w,h,0,0,w,h); return c;
}

function otsuThreshold(px){
  const hist=new Uint32Array(256);
  let n=0;
  for(let i=0;i<px.length;i+=4){ const g=Math.round(0.299*px[i]+0.587*px[i+1]+0.114*px[i+2]); hist[g]++; n++; }
  let sum=0; for(let i=0;i<256;i++) sum+=i*hist[i];
  let sumB=0,wB=0,maxVar=0,threshold=128;
  for(let t=0;t<256;t++){
    wB+=hist[t]; if(!wB) continue;
    const wF=n-wB; if(!wF) break;
    sumB+=t*hist[t];
    const mB=sumB/wB, mF=(sum-sumB)/wF, v=wB*wF*(mB-mF)*(mB-mF);
    if(v>maxVar){maxVar=v; threshold=t;}
  }
  return threshold;
}

function preprocessTextLine(canvas){
  const W=canvas.width*4,H=canvas.height*4;
  const big=document.createElement('canvas'); big.width=W; big.height=H;
  big.getContext('2d').drawImage(canvas,0,0,W,H);
  const ctx=big.getContext('2d'); const id=ctx.getImageData(0,0,W,H); const px=id.data;
  for(let i=0;i<px.length;i+=4){ const g=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2]; px[i]=px[i+1]=px[i+2]=g; px[i+3]=255; }
  const thr=otsuThreshold(px);
  for(let i=0;i<px.length;i+=4){ const v=px[i]>thr?255:0; px[i]=px[i+1]=px[i+2]=255-v; px[i+3]=255; }
  ctx.putImageData(id,0,0); return big;
}

function preprocessDigitBox(canvas){
  const W=canvas.width*8,H=canvas.height*8;
  const big=document.createElement('canvas'); big.width=W; big.height=H;
  big.getContext('2d').drawImage(canvas,0,0,W,H);
  const ctx=big.getContext('2d'); const id=ctx.getImageData(0,0,W,H); const px=id.data;
  const thr=otsuThreshold(px);
  for(let i=0;i<px.length;i+=4){
    const g=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
    const v=g>thr?255:0; px[i]=px[i+1]=px[i+2]=v; px[i+3]=255;
  }
  ctx.putImageData(id,0,0); return big;
}

function cleanOcrText(t){
  return t.replace(/\s+/g,'').replace(/^[^\u3041-\u30FF\u4E00-\u9FFF0-9A-Za-z]+/,'')
    .replace(/[^\u3041-\u30FF\u4E00-\u9FFF0-9A-Za-z\u30FC]+/g,'');
}

async function ocrTextLine(canvas){
  const r=await Tesseract.recognize(preprocessTextLine(canvas),'jpn',{tessedit_pageseg_mode:'7'});
  return cleanOcrText(r.data.text);
}

async function ocrDigitBox(canvas,oneDigit=false,logCtx=null){
  const cfg={tessedit_pageseg_mode:'8',tessedit_char_whitelist:'0123456789'};
  const r=await Tesseract.recognize(preprocessDigitBox(canvas),'eng',cfg);
  const out=pickDigitValue(r.data.text,oneDigit);
  // #region agent log
  if(logCtx) dbgLog('index.html:ocrDigitBox','digit OCR raw',{...logCtx,raw:r.data.text,nums:r.data.text.match(/\d+/g)||[],out,box:{w:canvas.width,h:canvas.height},oneDigit},'H2');
  // #endregion
  return out;
}

function levenshtein(a,b){
  if(!a)return b.length; if(!b)return a.length;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=0;i<a.length;i++){
    const cur=[i+1];
    for(let j=0;j<b.length;j++) cur.push(Math.min(cur[j]+1,prev[j+1]+1,prev[j]+(a[i]===b[j]?0:1)));
    prev=cur;
  }
  return prev[b.length];
}

function getBestMatch(rawText,dictionary){
  if(!rawText) return{word:'',dist:999,matched:false};
  const raw=cleanOcrText(rawText);
  let bestWord=raw,bestScore=999;
  for(const w of dictionary){
    const score=levenshtein(raw,w);
    if(score<bestScore){bestScore=score; bestWord=w;}
  }
  return{word:bestWord,dist:bestScore,matched:bestScore<=2};
}

function getShowdownNature(upKey,downKey){
  if(!upKey&&!downKey) return 'Serious';
  if(upKey&&!downKey) return 'Hardy';
  return SHOWDOWN_NATURES[`${upKey}:${downKey}`] || 'Serious';
}

}
initGrid(); loadDictionaries();

['f','b'].forEach(side=>{
  const dz=document.getElementById(`dz-${side}`), fi=document.getElementById(`fi-${side}`);
  dz.addEventListener('click', e => { if(e.target!==fi) fi.click(); });
  fi.addEventListener('change', e => e.target.files[0] && handleFile(e.target.files[0], side==='f'));
  dz.addEventListener('dragover', e => e.preventDefault());
  dz.addEventListener('drop', e => { e.preventDefault(); e.dataTransfer.files[0] && handleFile(e.dataTransfer.files[0], side==='f'); });
});

function handleFile(file,isFront){
  const img=new Image(); img.onload=()=>processImage(img,isFront);
  img.src=URL.createObjectURL(file);
  document.getElementById(isFront?'st-f':'st-b').textContent='処理中...';
}

async function processImage(img,isFront){
  const b=get169Bounds(img.width,img.height);
  vc.width=1920; vc.height=1080;
  vc.getContext('2d').drawImage(img,b.sx,b.sy,b.sw,b.sh,0,0,1920,1080);
  setStatus(CURRENT_PANELS===SMARTPHONE_PANELS?"スマホ座標を適用":"PC座標を適用");

  for(let i=0;i<6;i++){
    const p=CURRENT_PANELS[i], thumb=cropTo(vc,p.x,p.y,p.w,p.h), pv=document.getElementById(`pv${i}`);
    pv.width=thumb.width; pv.height=thumb.height; pv.getContext('2d').drawImage(thumb,0,0);
  }

  if(isFront){
    setStatus("表画面をOCR解析中...");
    FRONT_DATA=await parseFrontImage();
    document.getElementById('dz-f').classList.add('done');
    document.getElementById('st-f').textContent='解析完了 ✓';
  } else {
    setStatus("裏画面を解析中...");
    BACK_DATA=await parseBackImage();
    document.getElementById('dz-b').classList.add('done');
    document.getElementById('st-b').textContent='解析完了 ✓';
  }
  renderGrid();
  if(FRONT_DATA&&BACK_DATA){ setStatus("表・裏の解析が完了しました。",'var(--accent2)'); generateBlogText(); }
}

async function parseFrontImage(){
  const team=[], unmatched=[];
  RAW_DEBUG=[];
  for(let si=0;si<6;si++){
    const {x:px,y:py,w:pw,h:ph}=CURRENT_PANELS[si], rx=pw/ORIG_PW, ry=ph/ORIG_PH, rawRows={};
    for(const [key,dx,dy,ow,oh] of FRONT_ROWS){
      rawRows[key]=await ocrTextLine(cropTo(vc,px+Math.round(dx*rx),py+Math.round(dy*ry),Math.round(ow*rx),Math.round(oh*ry)));
    }
    RAW_DEBUG.push({slot:si+1,raw:rawRows});

    const poke=getBestMatch(rawRows.pokemon,POKEMON_DICT);
    const pokemon=poke.matched?poke.word:(rawRows.pokemon||'');
    if(!poke.matched&&pokemon) unmatched.push(si+1);
    // #region agent log
    dbgLog('index.html:parseFrontImage', 'front OCR slot', { slot: si + 1, rawRows, poke: { word: poke.word, dist: poke.dist, matched: poke.matched } }, 'H5');
    // #endregion

    const ab=getBestMatch(rawRows.ability,ABILITY_DICT);
    const it=getBestMatch(rawRows.item,ITEM_DICT);
    const moves=[];
    for(let mi=0;mi<4;mi++){
      const m=getBestMatch(rawRows[`move${mi+1}`],MOVE_DICT);
      moves.push(m.matched?m.word:(rawRows[`move${mi+1}`]||''));
    }
    team.push({slot:si+1,pokemon,ability:ab.matched?ab.word:rawRows.ability,item:it.matched?it.word:rawRows.item,moves,
      stats:{},evs:{},nature:'',natureUp:'',natureDown:''});
  }
  if(unmatched.length) setStatus(`スロット ${unmatched.join(', ')} のポケモン名は辞書未一致です。手修正してください。`,'var(--warn)');
  return team;
}

async function parseBackImage(){
  const result=[];
  for(let si=0;si<6;si++){
    const {x:px,y:py,w:pw,h:ph}=CURRENT_PANELS[si], rx=pw/ORIG_PW, ry=ph/ORIG_PH;
    const stats={},evs={};
    for(const [key,{stat:[sx,sy,sw,sh],ev:[ex,ey,ew,eh]}] of Object.entries(BACK_BOXES)){
      const [csx,csy,csw,csh]=getStatCropRect([sx,sy,sw,sh],key);
      stats[key]=await ocrDigitBox(cropTo(vc,px+Math.round(csx*rx),py+Math.round(csy*ry),Math.round(csw*rx),Math.round(csh*ry)),false,{slot:si+1,field:key,kind:'stat'});
      evs[key]=await ocrDigitBox(cropTo(vc,px+Math.round(ex*rx),py+Math.round(ey*ry),Math.round(ew*rx),Math.round(eh*ry)),true,{slot:si+1,field:key,kind:'ev'});
    }
    const nat=classifyNatureFromPixels(px,py,rx,ry);
    // #region agent log
    dbgLog('index.html:parseBackImage', 'back OCR slot', { slot: si + 1, stats, evs, nature: nat }, 'H3');
    // #endregion
    result.push({stats,evs,nature:nat.label,natureUp:nat.up,natureDown:nat.down});
  }
  return result;
}

function classifyNatureFromPixels(panelX,panelY,rx,ry){
  const ctx=vc.getContext('2d'); const statCounts={};
  for(const [key,[ox,oy,ow,oh]] of Object.entries(NATURE_STAT_BOXES)){
    const img=ctx.getImageData(panelX+Math.round(ox*rx),panelY+Math.round(oy*ry),Math.round(ow*rx),Math.round(oh*ry));
    let orange=0,blue=0;
    for(let i=0;i<img.data.length;i+=4){
      const r=img.data[i],g=img.data[i+1],b=img.data[i+2],a=img.data[i+3];
      if(a<150||Math.max(r,g,b)<=150) continue;
      if(r-b>25&&r-g>15&&g>130) orange++;
      if(b-r>25&&b-g>10&&g>140) blue++;
    }
    statCounts[key]={orange,blue};
  }
  const THRESH=8;
  let upKey='',downKey='',bestOrange=0,bestBlue=0;
  for(const [key,{orange,blue}] of Object.entries(statCounts)){
    if(orange>THRESH&&orange>bestOrange){bestOrange=orange; upKey=key;}
    if(blue>THRESH&&blue>bestBlue){bestBlue=blue; downKey=key;}
  }
  if(upKey&&upKey===downKey){
    const {orange,blue}=statCounts[upKey];
    if(orange>=blue) downKey=''; else upKey='';
  }
  const parts=[];
  if(upKey) parts.push(`+${STAT_LABELS[upKey]}`);
  if(downKey) parts.push(`-${STAT_LABELS[downKey]}`);
  // #region agent log
  dbgLog('index.html:classifyNatureFromPixels','nature pixel counts',{statCounts,upKey,downKey,label:parts.join(' ')||'補正なし',multiUp:upKey?1:0,multiDown:downKey?1:0},'H1');
  // #endregion
  return{label:parts.length?parts.join(' '):'補正なし',up:upKey,down:downKey};
}

function setField(id,val,dict){
  const el=document.getElementById(id); if(!el) return;
  el.value=val||''; el.className='';
  if(!val) return el.classList.add('empty');
  if(dict&&!dict.includes(val)) el.classList.add('raw');
}

function renderGrid(){
  for(let i=0;i<6;i++){
    if(FRONT_DATA){
      const f=FRONT_DATA[i];
      setField(`nm-${i}`,f.pokemon,POKEMON_DICT);
      setField(`ab-${i}`,f.ability,ABILITY_DICT);
      setField(`it-${i}`,f.item,ITEM_DICT);
      for(let j=0;j<4;j++) setField(`mv-${i}-${j}`,f.moves[j],MOVE_DICT);
    }
    if(BACK_DATA){
      const b=BACK_DATA[i];
      document.getElementById(`nat-${i}`).textContent='性格: '+(b.nature||'不明');
      for(const k of STAT_KEYS){
        document.getElementById(`sv-${i}-${k}`).textContent=b.stats[k]||'—';
        document.getElementById(`se-${i}-${k}`).textContent=b.evs[k]?`EV ${b.evs[k]}`:'';
        const sc=document.getElementById(`sc-${i}-${k}`); sc.className='sc';
        const lbl=STAT_LABELS[k];
        if(b.nature.includes(`+${lbl}`)) sc.classList.add('up');
        if(b.nature.includes(`-${lbl}`)) sc.classList.add('dn');
      }
    }
  }
}

function getMergedTeam(){
  return Array.from({length:6},(_,i)=>{
    const b=BACK_DATA?.[i]||{};
    return{
      slot:i+1,
      pokemon:document.getElementById(`nm-${i}`)?.value||'',
      ability:document.getElementById(`ab-${i}`)?.value||'',
      item:document.getElementById(`it-${i}`)?.value||'',
      moves:[0,1,2,3].map(j=>document.getElementById(`mv-${i}-${j}`)?.value||''),
      nature:b.nature||'', natureUp:b.natureUp||'', natureDown:b.natureDown||'',
      stats:b.stats||{}, evs:b.evs||{}
    };
  });
}

function generateBlogText(){
  const team=getMergedTeam();
  let showdownText="=== Pokémon Showdown Export ===\n\n";
  team.forEach(p=>{
    if(!p.pokemon) return;
    showdownText+=`${POKEMON_JA_TO_EN[p.pokemon]||p.pokemon}${p.item?` @ ${ITEM_JA_TO_EN[p.item]||p.item}`:''}\n`;
    if(p.ability) showdownText+=`Ability: ${ABILITY_JA_TO_EN[p.ability]||p.ability}\n`;
    const evList=[], keys={hp:"HP",attack:"Atk",defense:"Def",sp_attack:"SpA",sp_defense:"SpD",speed:"Spe"};
    Object.entries(p.evs).forEach(([k,v])=>{ if(v&&v!=='0') evList.push(`${v} ${keys[k]}`); });
    if(evList.length) showdownText+=`EVs: ${evList.join(' / ')}\n`;
    if(p.natureUp||p.natureDown) showdownText+=`${getShowdownNature(p.natureUp,p.natureDown)} Nature\n`;
    p.moves.forEach(m=>{ if(m) showdownText+=`- ${MOVE_JA_TO_EN[m]||m}\n`; });
    showdownText+='\n';
  });

  let blogHtml="=== ブログ用テーブルHTML ===\n\n";
  blogHtml+=`<div class="pchamp-team-table" style="max-width:800px;margin:20px auto;font-family:sans-serif;color:#e2e8f0;background:#1a1d27;padding:20px;border-radius:12px;border:1px solid #2a2d3a;">\n`;
  blogHtml+=`<h3 style="text-align:center;color:#4f8ef7;margin-bottom:20px;">構築パーティ紹介</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;">\n`;
  team.forEach(p=>{
    if(!p.pokemon) return;
    blogHtml+=`<div style="background:#1e2130;border:1px solid #2a2d3a;border-radius:8px;padding:15px;">`;
    blogHtml+=`<div style="font-weight:bold;color:#34d399;margin-bottom:8px;">${p.pokemon}</div>`;
    if(p.item) blogHtml+=`<div style="font-size:12px;">持ち物: ${p.item}</div>`;
    if(p.ability) blogHtml+=`<div style="font-size:12px;">特性: ${p.ability}</div>`;
    if(p.nature&&p.nature!=='補正なし') blogHtml+=`<div style="font-size:12px;">性格: ${p.nature}</div>`;
    blogHtml+=`<ul style="list-style:none;padding:0;margin:8px 0;font-size:12px;">${p.moves.filter(Boolean).map(m=>`<li>• ${m}</li>`).join('')}</ul>`;
    if(p.stats.hp) blogHtml+=`<div style="font-size:11px;">実数値: ${STAT_KEYS.map(k=>p.stats[k]).join('-')}</div>`;
    blogHtml+=`</div>`;
  });
  blogHtml+=`</div></div>\n`;
  document.getElementById('out').value=showdownText+'\n\n'+blogHtml;
}

function setStatus(msg,color='var(--warn)'){ const el=document.getElementById('status-bar'); el.textContent=msg; el.style.color=color; }
function dl(content,fname,mime){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type:mime})); a.download=fname; a.click(); URL.revokeObjectURL(a.href); }

document.getElementById('btn-csv').addEventListener('click',()=>{
  if(!FRONT_DATA) return alert('まず能力画面（表）をアップロードしてください。');
  const t=getMergedTeam(), hdr=['Slot','Pokemon','Ability','Item','Move1','Move2','Move3','Move4','Nature',...STAT_KEYS.map(k=>STAT_LABELS[k]),...STAT_KEYS.map(k=>STAT_LABELS[k]+'EV')].join(',');
  dl('\uFEFF'+hdr+'\n'+t.map(p=>[p.slot,p.pokemon,p.ability,p.item,...p.moves,p.nature,...STAT_KEYS.map(k=>p.stats[k]||''),...STAT_KEYS.map(k=>p.evs[k]||'')].join(',')).join('\n'),'s2_single_ranked_teams.csv','text/csv;charset=utf-8');
});
document.getElementById('btn-json').addEventListener('click',()=>{
  if(!FRONT_DATA) return alert('まず能力画面（表）をアップロードしてください。');
  dl(JSON.stringify({season:'M-2',rule:'シングル',teams:[{rank:1,team:getMergedTeam()}],updated_at:new Date().toISOString()},null,2),'s2_single_ranked_teams.json','application/json');
});
document.getElementById('btn-text').addEventListener('click',()=>{
  if(!FRONT_DATA||!BACK_DATA) return alert('表・裏の両方をアップロードしてください。');
  generateBlogText();
});
document.getElementById('btn-raw').addEventListener('click',()=>{
  if(!RAW_DEBUG.length) return alert('まず画像をアップロードしてください。');
  document.getElementById('out').value='=== OCR 生テキスト ===\n'+RAW_DEBUG.map(s=>`[Slot ${s.slot}]\n`+Object.entries(s.raw).map(([k,v])=>`  ${k}: ${v}`).join('\n')).join('\n\n');
});
